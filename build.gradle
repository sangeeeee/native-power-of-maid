plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Mirror Maven
    maven {
        url = "https://neoforged.forgecdn.net/releases"
    }
    maven {
        url = "https://neoforged.forgecdn.net/mojang-meta"
    }

    maven {
        url = "https://libraries.minecraft.net/"
    }

    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

}

base {
    archivesName = "${mod_file_name}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientSmoke {
            client()
            gameDirectory = project.file('run/client-smoke')
            systemProperty 'native_power_of_maid.clientSmoke', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'native-power-smoke', '--width', '1280', '--height', '720'
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Development tests are loaded in runs, but are not included in the release jar.
            sourceSet(sourceSets.gameTest)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "maven.modrinth:slashblade-resharped:${slash_blade_version}"
    // mrqx`s Slashblade Core
    implementation "maven.modrinth:2zhQmVfn:${mrqx_slash_blade_core_version}"

    // Touhou Little Maid
    implementation files(maid_snapshot_jar)
    compileOnly "maven.modrinth:simplebedrockmodel:1.4.0-neoforge+mc1.21.1"

    compileOnly "org.jetbrains:annotations:17.0.0"
}

// The snapshot and the public release share a mod version, so the version string
// cannot distinguish them. Verify the exact user-supplied compatibility build.
def maidSnapshotFile = file(maid_snapshot_jar)
tasks.register('verifyMaidSnapshot') {
    inputs.file(maidSnapshotFile)
    doLast {
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(maidSnapshotFile.bytes).encodeHex().toString()
        if (actual != 'ac7c07068be61216180a75e6845dc1e91f8c95a7c2e19ad241b81a127e7802dd') {
            throw new GradleException('Touhou Little Maid must be the supplied 1.5.3 NeoForge 1.21.1 snapshot. See libs/README.md.')
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyMaidSnapshot' }

tasks.register('prepareClientSmokeWorld', Sync) {
    dependsOn 'runGameTestServer'
    from 'run/gametest/world'
    into 'run/client-smoke/saves/native-power-smoke'
    exclude 'session.lock'
}
tasks.register('prepareClientSmokeOptions', Copy) {
    from 'src/gameTest/client-options.txt'
    into 'run/client-smoke'
    rename { 'options.txt' }
}
tasks.matching { it.name == 'runClientSmoke' }.configureEach {
    dependsOn 'prepareClientSmokeWorld', 'prepareClientSmokeOptions'
}


var generateModMetadata = tasks.register("generateModMetadata", Sync) {
    var replaceProperties = [
            minecraft_version                  : minecraft_version,
            minecraft_version_range            : minecraft_version_range,
            neo_version                        : neo_version,
            neo_version_range                  : neo_version_range,
            loader_version_range               : loader_version_range,
            mod_id                             : mod_id,
            mod_name                           : mod_name,
            mod_license                        : mod_license,
            mod_version                        : mod_version,
            mod_authors                        : mod_authors,
            mod_description                    : mod_description,
            mod_file_name                      : mod_file_name,
            slash_blade_version                : slash_blade_version,
            slash_blade_version_range          : slash_blade_version_range,
            mrqx_slash_blade_core_version      : mrqx_slash_blade_core_version,
            mrqx_slash_blade_core_version_range: mrqx_slash_blade_core_version_range,
            maid_version                       : maid_version,
            maid_version_range                 : maid_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
